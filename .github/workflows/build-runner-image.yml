# Reusable workflow: build the runner image, check it, smoke test it, push it.
# Called by release-runner.yml. It runs .github/scripts/build-and-push.sh,
# which uses plain docker commands (no third-party actions), so it works on a
# GHES server that does not mirror marketplace actions.
#
# Registry: Docker Hub by default, or any registry that accepts `docker login`.
#
# Repo variables : DOCKER_REGISTRY_USER   registry username (Docker Hub user/org login)
#                  DOCKER_REGISTRY_URL       empty or docker.io = Docker Hub; otherwise the
#                                            registry host, e.g. registry.example.com
#                  DOCKER_IMAGE_NAME         optional, e.g. myorg/github-runner
#                                            (default: <DOCKER_REGISTRY_USER>/github-runner)
#                  CI_RUNNER_LABELS          optional JSON array for runs-on
#                                            (default ["ubuntu-latest"])
# Repo secrets   : DOCKER_REGISTRY_TOKEN  registry access token (Docker Hub: a
#                                            Personal Access Token with Read & Write)
#                  GH_PAT_V1                 only for GHES builds: downloads the runner binary
#
# GH_PAT_V1 reaches the build as a BuildKit secret. It must never be a build
# arg, because build args are stored in the image history.
name: Build Runner Image

on:
  workflow_call:
    inputs:
      runner_version:
        description: Runner version to install and tag the image with (e.g. 2.324.0)
        type: string
        required: true
      extra_tag:
        description: Optional additional image tag (e.g. the release tag v1.4.0)
        type: string
        required: false
        default: ""
      github_host:
        description: GHES hostname to download the runner from. Empty = github.com.
        type: string
        required: false
        default: ""
      org_name:
        description: GHES org name (required with github_host)
        type: string
        required: false
        default: ""
      push:
        description: Push the image after a successful build. false = build and test only.
        type: boolean
        required: false
        default: true
    secrets:
      DOCKER_REGISTRY_TOKEN:
        required: false
      GH_PAT_V1:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build, test and publish
        env:
          RUNNER_VERSION: ${{ inputs.runner_version }}
          PUSH: ${{ inputs.push }}
          EXTRA_TAG: ${{ inputs.extra_tag }}
          REGISTRY: ${{ vars.DOCKER_REGISTRY_URL }}
          IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
          REGISTRY_USER: ${{ vars.DOCKER_REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.DOCKER_REGISTRY_TOKEN }}
          GH_HOST: ${{ inputs.github_host }}
          ORG: ${{ inputs.org_name }}
          GITHUB_PAT: ${{ secrets.GH_PAT_V1 }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: bash .github/scripts/build-and-push.sh
