# Reusable workflow: build the runner image, check it, smoke test it, push it.
# Called by release-runner.yml. Uses plain docker commands (no third-party
# actions) so it works on a GHES server that does not mirror marketplace actions.
#
# Registry: Docker Hub by default, or any registry that accepts `docker login`.
#
# Repo variables : DOCKER_REGISTRY_PU_USER   registry username (Docker Hub user/org login)
#                  DOCKER_REGISTRY_URL       empty or docker.io = Docker Hub; otherwise the
#                                            registry host, e.g. registry.example.com
#                  DOCKER_IMAGE_NAME         optional, e.g. myorg/github-runner
#                                            (default: <DOCKER_REGISTRY_PU_USER>/github-runner)
#                  CI_RUNNER_LABELS          optional JSON array for runs-on
#                                            (default ["ubuntu-latest"])
# Repo secrets   : DOCKER_REGISTRY_PU_TOKEN  registry access token (Docker Hub: a
#                                            Personal Access Token with Read & Write)
#                  GH_PAT_V1                 only for GHES builds: downloads the runner binary
#
# GH_PAT_V1 reaches the build as a BuildKit secret. It must never be a build
# arg, because build args are stored in the image history.
name: Build Runner Image

on:
  workflow_call:
    inputs:
      runner_version:
        description: Runner version to install and tag the image with (e.g. 2.324.0)
        type: string
        required: true
      github_host:
        description: GHES hostname to download the runner from. Empty = github.com.
        type: string
        required: false
        default: ""
      org_name:
        description: GHES org name (required with github_host)
        type: string
        required: false
        default: ""
      push:
        description: Push the image after a successful build. false = build and test only.
        type: boolean
        required: false
        default: true
    secrets:
      DOCKER_REGISTRY_PU_TOKEN:
        required: false
      GH_PAT_V1:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    env:
      DOCKER_BUILDKIT: "1"
      RUNNER_VERSION: ${{ inputs.runner_version }}
      GH_HOST: ${{ inputs.github_host }}
      ORG: ${{ inputs.org_name }}
      PUSH: ${{ inputs.push }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image reference
        env:
          REGISTRY: ${{ vars.DOCKER_REGISTRY_URL }}
          IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
          REGISTRY_USER: ${{ vars.DOCKER_REGISTRY_PU_USER }}
        run: |
          set -euo pipefail
          name="${IMAGE_NAME:-${REGISTRY_USER:+${REGISTRY_USER}/}github-runner}"
          name="${name,,}"                       # registries require lowercase
          registry="${REGISTRY#https://}"; registry="${registry%/}"
          case "${registry}" in
            ""|docker.io|index.docker.io|registry-1.docker.io)
              echo "IMAGE=${name}" >> "${GITHUB_ENV}"
              echo "LOGIN_HOST=" >> "${GITHUB_ENV}" ;;
            *)
              echo "IMAGE=${registry}/${name}" >> "${GITHUB_ENV}"
              echo "LOGIN_HOST=${registry}" >> "${GITHUB_ENV}" ;;
          esac
          if [[ "${PUSH}" == "true" && -z "${REGISTRY_USER}" ]]; then
            echo "DOCKER_REGISTRY_PU_USER variable is not set (needed to push)." >&2; exit 1
          fi

      - name: Log in to registry
        if: inputs.push
        env:
          REGISTRY_USER: ${{ vars.DOCKER_REGISTRY_PU_USER }}
          REGISTRY_TOKEN: ${{ secrets.DOCKER_REGISTRY_PU_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${REGISTRY_TOKEN}" ]] || { echo "DOCKER_REGISTRY_PU_TOKEN secret is not set." >&2; exit 1; }
          echo "${REGISTRY_TOKEN}" | docker login ${LOGIN_HOST:+"${LOGIN_HOST}"} -u "${REGISTRY_USER}" --password-stdin

      - name: Build image
        env:
          GITHUB_PAT: ${{ secrets.GH_PAT_V1 }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(--no-cache -f docker/Dockerfile
                --build-arg "GH_RUNNER_VERSION=${RUNNER_VERSION}"
                --label "org.opencontainers.image.title=github-actions-runner"
                --label "org.opencontainers.image.version=${RUNNER_VERSION}"
                --label "org.opencontainers.image.source=${SOURCE_URL}"
                --label "org.opencontainers.image.revision=${REVISION}")
          if [[ -n "${GH_HOST}" ]]; then
            [[ -n "${ORG}" ]] || { echo "org_name is required when github_host is set"; exit 1; }
            [[ -n "${GITHUB_PAT}" ]] || { echo "GH_PAT_V1 is required for a GHES build"; exit 1; }
            args+=(--build-arg "GITHUB_HOST=${GH_HOST}" --build-arg "ORG_NAME=${ORG}"
                   --secret id=gh_pat,env=GITHUB_PAT)
          fi
          docker build "${args[@]}" \
            -t "${IMAGE}:${RUNNER_VERSION}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:sha-${REVISION:0:7}" .

      - name: Check the token did not end up in the image
        env:
          GITHUB_PAT: ${{ secrets.GH_PAT_V1 }}
        run: |
          set -euo pipefail
          hist=$(docker history --no-trunc "${IMAGE}:${RUNNER_VERSION}")
          if [[ -n "${GITHUB_PAT}" ]] && grep -qF -- "${GITHUB_PAT}" <<<"${hist}"; then
            echo "FAIL: GH_PAT_V1 value found in image history. Do not push." >&2; exit 1
          fi
          if grep -qE 'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' <<<"${hist}"; then
            echo "FAIL: something that looks like a GitHub token is in the image history." >&2; exit 1
          fi
          echo "OK: no token found in image history."

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run --rm --entrypoint bash "${IMAGE}:${RUNNER_VERSION}" -euc '
            /actions-runner/bin/Runner.Listener --version
            docker --version
            jq --version
            openssl version
            test -x /entrypoint.sh && test -x /token.sh && test -x /healthcheck.sh && test -x /cleanup-offline-runners.sh
            bash -n /entrypoint.sh && bash -n /token.sh && bash -n /cleanup-offline-runners.sh
          '
          # Misconfiguration must fail fast with a clear message, not hang.
          if out=$(docker run --rm "${IMAGE}:${RUNNER_VERSION}" /entrypoint.sh true 2>&1); then
            echo "FAIL: container started without any configuration" >&2; exit 1
          fi
          grep -q "REPO_URL required" <<<"${out}" || { echo "unexpected entrypoint output: ${out}" >&2; exit 1; }

      - name: Push
        if: inputs.push
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${RUNNER_VERSION}"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:sha-${GITHUB_SHA:0:7}"
          echo "Published ${IMAGE}:${RUNNER_VERSION}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Log out of registry
        if: always() && inputs.push
        run: docker logout ${LOGIN_HOST:+"${LOGIN_HOST}"} || true
