# Removes offline self-hosted runners from the org. Only needed for PERSISTENT
# runners: ephemeral runners deregister themselves and GitHub removes ephemeral
# runners that stop connecting. Retire this workflow once every environment is
# ephemeral.
#
# Only runners whose name starts with one of RUNNER_NAME_PREFIXES are touched,
# so offline runners that belong to other teams are left alone.
#
# Logic lives in .github/scripts/cleanup-stale-runners.sh.
#
# Secret: GH_PAT_V1 must be allowed to manage org runners (admin:org, or a
# GitHub App token with the Self-hosted runners permission).
#
# Caveat: this job runs on a runner. If every runner is down it cannot run.
# Point CI_RUNNER_LABELS at a runner outside the pools you are cleaning, and
# check the schedule does not collide with your nightly server shutdown.
name: Cleanup Stale Runners

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be removed without deleting
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","linux"]') }}
    timeout-minutes: 10
    env:
      API_URL: ${{ github.api_url }}
      ORG: ${{ github.repository_owner }}
      TOKEN: ${{ secrets.GH_PAT_V1 }}
      RUNNER_NAME_PREFIXES: "dev-runner- uat-runner- prod-runner-"
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Remove offline runners
        run: bash .github/scripts/cleanup-stale-runners.sh
