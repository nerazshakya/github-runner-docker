# Build and publish the runner image.
#
# Triggers
#   release (published)  builds and PUBLISHES. The release tag (e.g. v1.4.0)
#                        becomes an extra image tag.
#   pull_request         builds and tests only (nothing is pushed; fork PRs skipped)
#   workflow_dispatch    manual: Actions > Release Runner Image > Run workflow
#
# Runner version: dispatch input, else repo variable RUNNER_VERSION, else the
# latest actions/runner release (see .github/scripts/resolve-version.sh).
# Pin RUNNER_VERSION for reproducible builds.
#
# github.com is the default download source. For GHES set the repo variables
# RUNNER_GITHUB_HOST and RUNNER_ORG_NAME (or use the dispatch inputs).
#
# All logic lives in .github/scripts/. This file only wires triggers to scripts.
# Registry settings and secrets: see build-runner-image.yml.
name: Release Runner Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      runner_version:
        description: Runner version (e.g. 2.324.0). Empty = RUNNER_VERSION variable, else latest.
        type: string
        required: false
        default: ""
      github_host:
        description: GHES hostname to download the runner from (empty = github.com)
        type: string
        required: false
        default: ""
      org_name:
        description: GHES org name (required with github_host)
        type: string
        required: false
        default: ""
  pull_request:
    paths:
      - docker/Dockerfile
      - scripts/**
      - .github/scripts/**
      - .github/workflows/build-runner-image.yml
      - .github/workflows/release-runner.yml

permissions:
  contents: read

concurrency:
  group: release-runner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      extra_tag: ${{ steps.resolve.outputs.extra_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        env:
          REQUESTED: ${{ inputs.runner_version }}
          PINNED: ${{ vars.RUNNER_VERSION }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash .github/scripts/resolve-version.sh

  build:
    needs: version
    uses: ./.github/workflows/build-runner-image.yml
    with:
      runner_version: ${{ needs.version.outputs.version }}
      extra_tag: ${{ needs.version.outputs.extra_tag }}
      github_host: ${{ inputs.github_host || vars.RUNNER_GITHUB_HOST || '' }}
      org_name: ${{ inputs.org_name || vars.RUNNER_ORG_NAME || '' }}
      push: ${{ github.event_name != 'pull_request' }}
    secrets:
      DOCKER_REGISTRY_TOKEN: ${{ secrets.DOCKER_REGISTRY_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
