# Base compose file — generic, no environment-specific defaults.
# Use with an environment override file:
#
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#   docker stack deploy -c docker-compose.yml -c docker-compose.prod.yml gh-runner-prod
#
# Local:
#   REPO_URL=https://github.com/org/repo ACCESS_TOKEN=ghp_xxx docker-compose up

version: "3.12"

services:
  runner:
    # Set DOCKER_REGISTRY_URL as an env var when running this compose file
    # e.g. DOCKER_REGISTRY_URL=yourcompany.registy.io docker-compose up
    image: ${DOCKER_REGISTRY_URL}/my-org/github-runner:latest

    environment:
      # Auth: ACCESS_TOKEN (PAT) is recommended — token.sh fetches a fresh
      # registration token on every start so expiry is never a problem.
      # RUNNER_TOKEN is a fallback but expires in 1 hour.
      ACCESS_TOKEN:     ${ACCESS_TOKEN:-}
      RUNNER_TOKEN:     ${RUNNER_TOKEN:-}

      # GitHub App auth (preferred over a PAT). When APP_ID is set it wins.
      # The private key is NOT an env var: mount it as a Swarm secret, see the
      # commented "secrets" blocks at the bottom of this file.
      APP_ID:              ${APP_ID:-}
      APP_INSTALLATION_ID: ${APP_INSTALLATION_ID:-}

      # Scope: repo | org | enterprise  (provide the matching var below)
      RUNNER_SCOPE:     ${RUNNER_SCOPE:-repo}
      REPO_URL:         ${REPO_URL:-}           # repo scope
      ORG_NAME:         ${ORG_NAME:-}           # org scope
      ENTERPRISE_NAME:  ${ENTERPRISE_NAME:-}    # enterprise scope

      # Optional
      GITHUB_HOST:      ${GITHUB_HOST:-github.com}    # override for GHES
      LABELS:           ${LABELS:-self-hosted,linux,docker}
      RUNNER_GROUP:     ${RUNNER_GROUP:-Default}
      RUNNER_NAME:      ${RUNNER_NAME:-}
      # EPHEMERAL: set per environment in the override files, NOT in runner.env
      # (runner.env is shared by dev/uat/prod). true = take one job, deregister,
      # exit; Swarm then starts a fresh container (needs restart_policy "any").
      EPHEMERAL:            ${EPHEMERAL:-false}
      DISABLE_AUTO_UPDATE:  ${DISABLE_AUTO_UPDATE:-false}

    # Socket mount — runner uses host Docker daemon directly.
    # docker commands in jobs (docker build, docker stack deploy etc.)
    # go through this socket and execute on the host.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # host Docker socket
      # No /_work volume on purpose. A named volume is shared by every replica
      # of the service (they would trample each other's checkouts) and it
      # carries one job's files into the next, which defeats ephemeral runners.
      # /_work now lives in the container's own filesystem, fresh per container.
      - runner-logs:/actions-runner/_diag           # persists logs after container exits
      - /deployment:/deployment   

    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    restart: on-failure:3

    # Time for the SIGTERM trap to deregister before Docker sends SIGKILL.
    stop_grace_period: 30s

    deploy:
      replicas: 1
      # "any" is required for ephemeral runners: they exit 0 after each job and
      # "on-failure" would NOT replace them, slowly draining the pool to zero.
      # No max_attempts: it would stop the pool after N jobs.
      restart_policy:
        condition: any
        delay: 15s
      resources:
        limits:
          cpus: "2"
          memory: 4G

volumes:
  runner-logs:

# GitHub App private key as a Swarm secret (create once per swarm):
#   docker secret create gh_app_key ./app-private-key.pem
# Then uncomment BOTH blocks (the stack fails to deploy if the secret is missing):
#
# services:
#   runner:
#     secrets:
#       - gh_app_key
# secrets:
#   gh_app_key:
#     external: true