# DEV environment override.
#
# Usage:
#   ./deploy.sh deploy -s gh-runner-dev -e /deployment/GitHub/runner.env \
#     -c docker/docker-compose.yml -o docker/docker-compose.dev.yml

services:
  runner:
    environment:
      LABELS:      "dev"
      RUNNER_NAME: "dev-runner"
      EPHEMERAL:   "true"     # one job per container; Swarm refills the pool

    deploy:
      replicas: 2   
      placement:
        constraints:
          - node.role == manager
      # restart_policy is inherited from docker-compose.yml (condition: any)