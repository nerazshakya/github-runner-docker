# UAT environment override.
# Usage: docker-compose -f docker-compose.yml -f docker-compose.uat.yml up
#        docker stack deploy -c docker-compose.yml -c docker-compose.uat.yml gh-runner-uat

services:
  runner:
    environment:
      LABELS:      "uat"
      RUNNER_NAME: "uat-runner"
      # EPHEMERAL: "true"   # enable after DEV has run clean for a while

    deploy:
      replicas: 2   
      placement:
        constraints:
          - node.role == manager
      # restart_policy is inherited from docker-compose.yml (condition: any)