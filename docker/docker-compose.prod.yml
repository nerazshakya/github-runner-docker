# PROD environment override.
# Usage: docker stack deploy -c docker-compose.yml -c docker-compose.prod.yml gh-runner-prod
#
# Two replicas so one hung job cannot block the next PROD deploy.

services:
  runner:
    environment:
      LABELS:       "prod"
      RUNNER_NAME:  "prod-runner"
      # EPHEMERAL: "true"   # enable after UAT has run clean for a while

    deploy:
      replicas: 2   
      placement:
        constraints:
          - node.role == manager
      # restart_policy is inherited from docker-compose.yml (condition: any)